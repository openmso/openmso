[workspace]
resolver = "2"
members = ["demo", "omso-cli"]
# Still on OCP v0 and excluded until their phase-2 port; the sources are
# untouched, so re-adding them here is the whole of that change.
exclude = ["siglent-sds1000xe", "generic-fx2"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# OCP v1 types, nng transport, CaptureServer/CaptureClient. A path dependency
# until openmso-api tags a v1 release: a container build needs the sibling
# checkout inside its context, which packaging/linux/Dockerfile does not do.
openmso = { path = "../../openmso-api/rust/openmso" }
serde_json = "1"
libc = "0.2"
